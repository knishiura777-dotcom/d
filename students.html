<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>学生作品ギャラリー | Web App Library</title><meta name="description" content="学生が制作したWebアプリ作品の展示ページ。制作年度・テーマ・アプリを紹介します。">
<style>
:root{font-family:system-ui,-apple-system,"Noto Sans JP",sans-serif;color-scheme:light;--ink:#17334a;--muted:#5b6c78;--line:#d7e4e5}*{box-sizing:border-box}body{margin:0;background:#f3f8f6;color:var(--ink)}a{color:inherit}.wrap{width:min(1150px,calc(100% - 32px));margin:auto}header{background:linear-gradient(120deg,#123e47,#18626a 56%,#31788c);color:white;padding:30px 0 58px}.nav{display:flex;gap:9px;flex-wrap:wrap;margin-bottom:45px}.nav a{text-decoration:none;border:1px solid #ffffff73;padding:11px 16px;border-radius:99px;font-weight:700;font-size:.86rem}.nav .selected{color:#16434b;background:white}.eyebrow{font-size:.75rem;letter-spacing:.15em;color:#b8edda;font-weight:800}h1{font-size:clamp(2.1rem,5vw,3.8rem);margin:10px 0}header p{line-height:1.8;max-width:730px;color:#e2f3ee}.heroBottom{display:flex;align-items:center;justify-content:space-between;gap:20px;flex-wrap:wrap}.qrbox{background:#ffffff21;border-radius:16px;padding:12px;display:flex;align-items:center;gap:13px;font-size:.86rem}.qrbox img{width:90px;height:90px;background:white;padding:6px;border-radius:10px}.main{padding:35px 0 70px}.intro{margin:0 0 24px;line-height:1.8;color:var(--muted)}.controls{display:grid;grid-template-columns:1fr 190px 190px;gap:10px;margin-bottom:24px}input,select{min-width:0;width:100%;border:1px solid var(--line);border-radius:11px;background:white;padding:13px;font:inherit;color:var(--ink)}.stats{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:20px}.pill{background:#e0efeb;padding:8px 13px;border-radius:99px;font-size:.82rem}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(275px,1fr));gap:16px}.card{background:white;border:1px solid var(--line);border-radius:18px;padding:21px;box-shadow:0 8px 25px #184e4a0b;display:flex;flex-direction:column;min-height:255px}.card .category{font-size:.73rem;color:#15746d;font-weight:800}.card h2{font-size:1.13rem;line-height:1.5;margin:12px 0 8px}.desc{color:var(--muted);font-size:.87rem;line-height:1.8;flex:1}.meta{border-top:1px solid var(--line);padding-top:12px;display:grid;gap:5px;font-size:.8rem;color:#45636a}.actions{display:flex;gap:8px;margin-top:18px}.actions a,.actions button{border:0;background:#166a6a;color:#fff;padding:11px;border-radius:9px;text-decoration:none;font-weight:750;font:inherit;cursor:pointer;flex:1;text-align:center}.actions button{background:#e2f2f0;color:#0a6563}.empty{grid-column:1/-1;background:white;padding:42px;border:1px dashed #9abeba;border-radius:20px;text-align:center;line-height:2;color:var(--muted)}.empty b{display:block;font-size:1.2rem;color:var(--ink)}footer{padding:20px 0 50px;color:var(--muted);font-size:.82rem}.overlay[hidden]{display:none}.overlay{position:fixed;inset:0;background:#091e21c9;display:grid;place-items:center;padding:16px;z-index:20}.modal{width:min(430px,100%);max-height:90vh;overflow:auto;background:white;border-radius:18px;padding:23px;text-align:center}.modal img{width:min(280px,90%);aspect-ratio:1}.modal p{overflow-wrap:anywhere;font-size:.78rem}.modal button{padding:10px 20px;border:1px solid var(--line);border-radius:8px;background:white;cursor:pointer}@media(max-width:700px){.controls{grid-template-columns:1fr}.qrbox img{width:70px;height:70px}header{padding-bottom:35px}}
</style></head><body>
<header><div class="wrap"><nav class="nav"><a href="index.html">授業・研究アプリ</a><a class="selected" href="students.html" aria-current="page">学生作品ギャラリー</a></nav><div class="eyebrow">STUDENT CREATIONS · WEB APP SHOWCASE</div><h1>学生作品ギャラリー</h1><div class="heroBottom"><p>学生が自ら発想し、制作したWebアプリを紹介する独立した作品集です。作品のテーマや制作年度を確認し、その場で体験できます。</p><div class="qrbox"><img src="qr/library.png" alt="Web App LibraryのQRコード"><span>授業用ライブラリへ<br>スマホでアクセス</span></div></div></div></header>
<main class="wrap main"><p class="intro">作品のカテゴリ・制作年度から探せます。作者名は公開許可がある場合だけ記載し、未許諾の場合は非表示にしてください。</p><div class="controls"><input type="search" id="search" placeholder="作品名・テーマから検索" aria-label="作品を検索"><select id="category" aria-label="カテゴリ"><option value="">すべてのカテゴリ</option></select><select id="sort" aria-label="並び順"><option value="new">制作年度の新しい順</option><option value="old">制作年度の古い順</option><option value="title">作品名順</option></select></div><div class="stats"><span class="pill" id="count">0作品</span><span class="pill" id="years">制作年度別に探す</span></div><div id="grid" class="grid" aria-live="polite"></div></main><footer class="wrap">Web App Library · Student Showcase — 学生の創造性と学びの記録</footer>
<div class="overlay" id="overlay" hidden><div class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle"><h2 id="modalTitle"></h2><img id="modalImage" alt="作品へのQRコード"><p id="modalURL"></p><button id="close" type="button">閉じる</button></div></div>
<script>
'use strict';let apps=[];const $=id=>document.getElementById(id);function el(t,c,v){let n=document.createElement(t);if(c)n.className=c;if(v!==undefined)n.textContent=v;return n}function render(){let q=$('search').value.normalize('NFKC').toLowerCase().trim();let v=apps.filter(a=>(!$('category').value||a.category===$('category').value)&&[a.title,a.description,a.category,a.academic_year,a.course,a.student_comment].join(' ').normalize('NFKC').toLowerCase().includes(q));let mode=$('sort').value;v.sort((a,b)=>mode==='title'?a.title.localeCompare(b.title,'ja'):mode==='old'?(a.academic_year||'9999').localeCompare(b.academic_year||'9999'):(b.academic_year||'').localeCompare(a.academic_year||''));$('count').textContent=v.length+'作品';$('years').textContent=new Set(apps.map(a=>a.academic_year).filter(Boolean)).size+'制作年度';$('grid').replaceChildren();if(!v.length){let z=el('div','empty');z.append(el('b','',apps.length?'該当する学生作品がありません':'学生作品の登録待ちです'),el('span','',apps.length?'条件を変更してください。':'学生が制作したと確認できた作品だけをここに掲載します。'));$('grid').append(z);return}for(const a of v){let c=el('article','card');c.append(el('div','category',a.category),el('h2','',a.title),el('p','desc',a.student_comment||a.description));let m=el('div','meta');m.append(el('span','', '制作年度：'+(a.academic_year||'未登録')));if(a.course)m.append(el('span','', '授業・ゼミ：'+a.course));if(a.creator)m.append(el('span','', '作者：'+a.creator));c.append(m);let actions=el('div','actions'),aopen=el('a','','アプリを開く'),b=el('button','','QRを表示');aopen.href=a.url;aopen.target='_blank';aopen.rel='noopener';b.onclick=()=>{ $('modalTitle').textContent=a.title;$('modalImage').src=a.qr;$('modalURL').textContent=a.url;$('overlay').hidden=false;$('close').focus()};actions.append(aopen,b);c.append(actions);$('grid').append(c)}}$('close').onclick=()=>$('overlay').hidden=true;$('overlay').onclick=e=>{if(e.target===$('overlay'))$('overlay').hidden=true};document.onkeydown=e=>{if(e.key==='Escape')$('overlay').hidden=true};$('search').oninput=render;$('category').onchange=render;$('sort').onchange=render;fetch('webapps.json').then(r=>{if(!r.ok)throw Error(r.status);return r.json()}).then(data=>{apps=data.filter(a=>a.collection==='student');for(const cat of [...new Set(apps.map(a=>a.category))].sort()){let o=el('option','',cat);o.value=cat;$('category').append(o)}render()}).catch(()=>{$('grid').append(el('div','empty','作品データを読み込めません。GitHub Pagesで開いてください。'))});
</script></body></html>
