<body>
<div class="wrap">
<header class="top">
  <div class="brand"><div class="brandLogo" aria-hidden="true">¥</div><div>MONEY QUEST<small>お金と心を育てるゲーム</small></div></div>
  <div class="topRight"><span class="pill" id="topStatus">LEVEL 1 · はじめの一歩</span><button type="button" class="btn secondary small" id="resetButton" title="記録を消去して最初から遊ぶ">リセット</button></div>
</header>
<nav class="subnav" id="nav" aria-label="ゲームのメニュー"></nav>
<main id="app"></main>
<footer class="footer">MONEY QUEST v0.3｜教育用・架空のシナリオです。実際の投資助言や利回りの予測ではありません。損切りの判断は投資目的・商品・資金の必要時期で異なります。<br>記録はこの端末のブラウザ内だけに保存します。外部送信・広告・ログインなし。参考：金融庁「資産形成の基本」、J-FLEC「資産形成タイムトラベル」、GPIF「運用状況」。</footer>
</div>
<script>

'use strict';
const CATEGORIES={saving:{title:'節約',emoji:'🪙',sub:'支出を整えて、選択の自由を増やす',color:'#80e3c4'},compound:{title:'複利',emoji:'🌱',sub:'少しのお金が、時間をかけてどうなるかを見てみよう',color:'#9cc8ff'},mind:{title:'メンタル',emoji:'🧠',sub:'感情の波と上手につきあう',color:'#c6b1ff'},sell:{title:'損切り',emoji:'🛡️',sub:'価格と根拠を分けて考える',color:'#ffa0ba'}};
const ORDER=['saving','compound','mind','sell'];
const QUESTIONS={
 saving:[
  {title:'毎日のコーヒー、どうする？',story:'平日20日間、1杯450円のカフェを利用しています。楽しみは残しながら、将来のための余裕も作りたい。',q:'あなたなら、どの習慣を選びますか？',opts:[
   {label:'毎日やめて、すべて自宅で飲む',points:2,save:9000,joy:-2,tag:'節約の効果',why:'毎月9,000円の余裕。ただし楽しみまで削ると、長期継続が難しいことも。気に入って続けられるなら合理的です。'},
   {label:'週2回はカフェを楽しみ、あとは自宅で飲む',points:3,save:5400,joy:2,tag:'持続可能な習慣',why:'月12回分＝5,400円の節約。お金と楽しみを両立させる工夫が長続きにつながります。'},
   {label:'これまで通り、毎日利用する',points:1,save:0,joy:2,tag:'優先順位',why:'日々の満足を選ぶことも大切。何に価値を感じているかを意識し、別の支出で余裕を作る方法もあります。'}] },
  {title:'使っていないサブスク',story:'毎月980円のサービスを3つ契約中。よく使うのは1つだけです。',q:'次の更新日までにどうしますか？',opts:[
   {label:'3つとも解約して、必要なら再契約',points:2,save:2940,joy:-1,tag:'固定費の点検',why:'固定費削減の効果は続きます。ただし本当に使うサービスまで手放す必要はありません。'},
   {label:'使っていない2つを解約する',points:3,save:1960,joy:2,tag:'支出の最適化',why:'生活の満足を保ちつつ、毎月1,960円の余裕が生まれます。固定費は一度見直すと効果が続きやすい項目です。'},
   {label:'見直しが面倒なので放置する',points:0,save:0,joy:0,tag:'現状維持バイアス',why:'小さな金額でも自動更新が続くと累積します。「今のまま」が楽に感じる心理を知っておきましょう。'}] },
  {title:'頑張って節約？ それとも余裕？',story:'月に1度、荒天の夜に帰宅するときの話です。徒歩25分（無料）か、夜間のタクシー（1,500円）。道は暗く、雨が強く降っています。',q:'節約のためなら、何を優先しますか？',opts:[
   {label:'危険でも徒歩。1円も使わない',points:0,save:1500,joy:-3,tag:'節約の限界',why:'支出の削減が安全や健康を損なうなら、最適な選択とは限りません。節約は目的ではなく手段です。'},
   {label:'安全のためタクシーを使い、別の日に調整する',points:3,save:0,joy:2,tag:'安全と長期視点',why:'この場面では安全を優先する判断に価値があります。削減できる支出と守るべき支出を区別しましょう。'},
   {label:'天候と安全な交通手段を確認して決める',points:3,save:0,joy:2,tag:'情報収集',why:'安全な代替交通があるか確認するのは合理的です。値段だけでなく、時間・健康・安全も意思決定の軸です。'}] }
 ],
 compound:[
  {title:'複利の落とし穴',story:'グラフでは、毎月の積立を続けた場合の「一定利回り」を仮定しています。しかし現実の相場は上下します。',q:'グラフを見て、どの理解が適切ですか？',opts:[
   {label:'年利5%に設定すれば、実際も毎年5%増える',points:0,tag:'確実性の錯覚',why:'シミュレーションの年利は仮定です。市場の収益率は変動し、元本割れの可能性もあります。'},
   {label:'複利の可能性は理解できるが、将来の結果は確約できない',points:3,tag:'不確実性の理解',why:'その通りです。時間と積立は重要ですが、利回りが固定された未来の保証ではありません。'},
   {label:'長期なら絶対に損をしない',points:0,tag:'リスクの過小評価',why:'長期投資でも損失は起こりえます。投資先の分散、資金の用途、生活防衛資金も考えることが重要です。'}] }
 ],
 mind:[
  {title:'突然の市場急落！',story:'長期の資産形成を目的とした、幅広く分散された投資信託が25%下落。収入や生活防衛資金には変化がありません。',q:'ニュースが不安をあおる中、どう対応しますか？',opts:[
   {label:'不安を消したいので、何も確認せず全額売る',points:0,tag:'損失回避と感情',why:'売却が必要な状況もありますが、不安だけで売ると当初の計画と矛盾しがちです。目的と資金の必要時期を確認しましょう。'},
   {label:'投資計画・資産配分・許容損失を確認して決める',points:3,tag:'事前ルール',why:'価格変動そのものと投資方針の崩れを区別しています。必要なら資産配分を調整する判断も合理的です。'},
   {label:'必ず反発するはずなので、借金して一括購入',points:0,tag:'過信とレバレッジ',why:'反発は保証されません。借金を使った追加投資は損失を拡大させる可能性があります。'}] },
  {title:'SNSで話題の急騰株',story:'SNSでは「今買わないと一生後悔する！」の声。ある株が1週間で50%上昇しています。',q:'次の一手は？',opts:[
   {label:'乗り遅れないよう、貯金をすべて投じる',points:0,tag:'FOMO（取り残される不安）',why:'他人の利益や勢いだけで判断すると、自分のリスク許容度を超えやすくなります。'},
   {label:'事業内容・価格・リスクと自分の計画を確認する',points:3,tag:'情報と感情の分離',why:'上昇の理由と投資根拠を検討します。理解できないなら見送る選択も立派な判断です。'},
   {label:'絶対に危険だと思い、理由を調べない',points:1,tag:'反射的な判断',why:'見送ることは合理的でも、すべてを感情で決める必要はありません。調査の価値もあります。'}] },
  {title:'毎日資産をチェック',story:'評価額を見るたびに落ち込み、授業や仕事に集中できません。投資自体は長期計画です。',q:'どうすれば心を守れそうですか？',opts:[
   {label:'気になるので、1時間ごとにチェックする',points:0,tag:'注意の捕捉',why:'短期の値動きに注意を奪われ、ストレスや衝動的な売買が増える場合があります。'},
   {label:'見直し日と売買条件をあらかじめ決める',points:3,tag:'事前コミットメント',why:'判断ルールを先に作ることで、目先の感情に振り回される可能性を減らせます。'},
   {label:'不安なので投資について一切考えない',points:1,tag:'回避行動',why:'画面を見る頻度を減らすのは有効でも、必要な点検まで避けるとリスクの見落としにつながります。'}] }
 ],
 sell:[
  {title:'値下がりした個別株',story:'ある企業の株は買値より35%下落。しかも主力事業が縮小し、購入時に期待した競争優位が崩れたという情報があります。',q:'「買値に戻るまで待ちたい」気持ちをどう扱いますか？',opts:[
   {label:'買値に戻るまで何年でも絶対に保有する',points:0,tag:'アンカリング',why:'買値は心理的な基準ですが、将来の事業価値を決めません。取得価格だけで保有を続けるのは危険です。'},
   {label:'新しい情報で投資根拠を再評価し、売却・縮小も検討する',points:3,tag:'根拠の更新',why:'事業の見通しが変わったなら、保有理由そのものを更新します。損失を確定することと判断の失敗は同義ではありません。'},
   {label:'下がった分だけ、根拠なしに大きく買い増す',points:0,tag:'損失の追跡',why:'下落しただけで割安とは限りません。企業価値を検証せずに買い増すとリスクが集中します。'}] },
  {title:'インデックス投資が下落',story:'広く分散されたインデックスファンドが20%下落。しかし運用目的、生活防衛資金、投資期間は当初と変わっていません。',q:'損切りについて最も適切な考え方は？',opts:[
   {label:'20%下がったら、商品を問わず必ず損切り',points:0,tag:'機械的な売却',why:'短期売買の損切りルールと、長期積立投資の見直し基準は同じではありません。'},
   {label:'計画に照らして保有・リバランス・縮小を検討する',points:3,tag:'商品と目的の区別',why:'価格下落だけでなく、資金の用途や許容リスクを含めて判断します。長期保有も常に正解というわけではありません。'},
   {label:'必ず回復するので、投資リスクの確認は一切不要',points:0,tag:'楽観バイアス',why:'市場は確実に回復するとは限りません。持ち続ける選択にも、合理的な説明が必要です。'}] },
  {title:'半年後に必要なお金',story:'6か月後に支払う学費を個別株で運用中。現在は買値より8%上昇していますが、値動きが激しい状況です。',q:'利益が出ている今、何を優先しますか？',opts:[
   {label:'もっと増えるかもしれないから、必要な日まで全額投資する',points:0,tag:'目先の利益への固執',why:'使う時期が決まったお金では、値上がりの期待より支払い能力の確保が重要です。'},
   {label:'必要資金を安全性と流動性の高い形に移す',points:3,tag:'目的に合わせた資金管理',why:'売る・売らないは利益率だけで決めません。必要な時期に使える状態を保つことが大切です。'},
   {label:'いったん倍になるまで待ってから判断する',points:0,tag:'目標値への固着',why:'値上がり目標を優先すると、期限がある支払いに使えなくなるリスクがあります。'}] }
 ]
};
const KEY='moneyquest-v01'; // v0.1の学習記録を引き継ぐ
const defaults=()=>({screen:'home',steps:{saving:0,compound:0,mind:0,sell:0},scores:{saving:0,compound:0,mind:0,sell:0},done:{saving:false,compound:false,mind:false,sell:false},records:[],saved:0,joy:60,feedback:null,compoundMode:'guide',habit:{type:'juice',price:160,skips:10,years:20,rate:5},sim:{monthly:30000,rate:5,years:20,addSaving:true}});
let S=defaults();
try{const data=JSON.parse(localStorage.getItem(KEY)||'null');if(data&&data.sim&&data.steps&&data.done&&Array.isArray(data.records)){S={...defaults(),...data,feedback:null,screen:'home'};}}catch(_){}
if(!S.habit)S.habit={type:'juice',price:160,skips:10,years:20,rate:5};
const fmt=n=>Math.round(n).toLocaleString('ja-JP');
const yen=n=>'¥'+fmt(n);
const totalScore=()=>Object.values(S.scores).reduce((a,b)=>a+b,0);
const doneCount=()=>ORDER.filter(s=>S.done[s]).length;
const chapterPoints={saving:9,compound:3,mind:9,sell:9};
const nextCategory=()=>ORDER.find(k=>!S.done[k])||'report';
const persist=()=>{try{const copy={...S,feedback:null};localStorage.setItem(KEY,JSON.stringify(copy))}catch(_){}};
function changeScreen(v){S.screen=v;S.feedback=null;persist();render();window.scrollTo({top:0,behavior:'smooth'});}
function renderNav(){document.getElementById('nav').innerHTML=`<button class="navBtn ${S.screen==='home'?'active':''}" data-go="home">🏠 ホーム</button>${ORDER.map(k=>`<button class="navBtn ${S.screen===k?'active':''} ${S.done[k]?'complete':''}" data-go="${k}">${CATEGORIES[k].emoji} ${CATEGORIES[k].title}</button>`).join('')}<button class="navBtn ${S.screen==='report'?'active':''}" data-go="report">🏆 結果</button>`;let level=totalScore()>=23?4:totalScore()>=15?3:totalScore()>=7?2:1;document.getElementById('topStatus').textContent=`LEVEL ${level} · ${doneCount()}/4 ステージ完了`}
function summaryMetrics(){return `<div class="metrics"><div class="metric"><div class="mLabel">獲得ポイント</div><div class="mNum gold">${totalScore()} <span class="tiny">/ 30</span></div></div><div class="metric"><div class="mLabel">見つけた節約額 / 月</div><div class="mNum mint">${yen(S.saved)}</div></div><div class="metric"><div class="mLabel">クリアしたステージ</div><div class="mNum">${doneCount()} / 4</div></div></div>`}
function home(){return `<section class="hero"><div><div class="eyebrow">FINANCIAL × PSYCHOLOGY GAME</div><h1>お金が育つ。<br><span>判断力も育つ。</span></h1><p>節約、複利、メンタル、損切り。日常の「どうする？」を選びながら、お金と心の仕組みを楽しく学ぼう。目指すのは一攫千金ではなく、自分で納得できる判断。</p><div class="actions"><button class="btn" data-go="${nextCategory()==='report'?'report':nextCategory()}">${doneCount()?'続きからプレイ':'ゲームを始める'} <span aria-hidden="true">→</span></button><button class="btn secondary" data-go-habit>🥤 ちょこっと節約を試す</button><button class="btn secondary" data-go="report">成績を見る</button></div></div><div class="heroArt"><div class="twinkle">✧ ✦ ✧</div><div class="coin">¥</div><div class="artCaption">LEVEL UP YOUR CHOICES!</div></div></section>${summaryMetrics()}<section><div class="sectionHead"><div><h2>4つの冒険ステージ</h2><p>好きな順番で遊べます。全ステージで約10〜15分。</p></div></div><div class="islands">${ORDER.map((k,i)=>`<button class="island ${S.done[k]?'done':''}" data-go="${k}"><span class="emoji">${CATEGORIES[k].emoji}</span><span class="chapter">STAGE ${i+1}</span><strong>${CATEGORIES[k].title}</strong><span class="desc">${CATEGORIES[k].sub}</span><span class="status">${S.done[k]?'クリア済み ✓':'プレイする →'}</span></button>`).join('')}</div></section><div class="callout"><strong>このゲームの特徴：</strong>「利益が出れば正解」ではなく、判断の根拠・リスク・生活の満足度を大切にします。実際の資金は使いません。</div>`}
function titleArea(k){const count=QUESTIONS[k].length;const i=Math.min(S.steps[k],count);return `<div class="pageTop"><div class="eyebrow">${CATEGORIES[k].emoji} STAGE ${ORDER.indexOf(k)+1} · ${i===count?'COMPLETE':`MISSION ${i+1}/${count}`}</div><h1 class="pageTitle">${k==='compound'?'複利（ふくり）':CATEGORIES[k].title}クエスト</h1><div class="muted">${CATEGORIES[k].sub}</div><div class="progressTrack"><div class="progressFill" style="width:${i/count*100}%"></div></div><div class="progressText"><span>このステージの進み具合</span><span>${i} / ${count}</span></div></div>`}
function quiz(k){const index=S.steps[k];if(index>=QUESTIONS[k].length)return stageDone(k);const q=QUESTIONS[k][index];const f=S.feedback&&S.feedback.stage===k?S.feedback:null;const options=f?`<div class="feedback" role="status"><span class="chip">${f.points} / 3 POINTS · ${f.tag}</span><h3>${f.points===3?'ナイス判断！':f.points>0?'気づきが増えた！':'ここが学びどころ！'}</h3><p><strong>あなたの選択：</strong>${f.label}</p><p>${f.why}</p>${k==='saving'?`<p><strong>この選択による節約額：</strong>${yen(f.save)}/月（例示）</p>`:''}<div class="actions"><button class="btn" data-next="${k}">${index+1===QUESTIONS[k].length?'ステージをクリア →':'次のミッション →'}</button></div></div>`:`<div class="choices">${q.opts.map((o,i)=>`<button class="choice" data-answer="${k}:${i}"><span class="letter">${'ABC'[i]}</span><span>${o.label}</span></button>`).join('')}</div>`;
return `${titleArea(k)}<div class="sideBySide"><section class="card"><div class="miniHead">SCENE ${index+1}</div><h2 class="question">${q.title}</h2><div class="story">${q.story}</div><h3 class="question">${q.q}</h3>${options}<div class="note">判断には複数の合理的な選択肢があります。ポイントは教育用の目安で、投資成績や性格を評価するものではありません。</div></section><aside class="sideStack"><div class="smallCard"><div class="miniHead">QUEST STATUS</div><div class="bigValue">${S.scores[k]} <span class="tiny">/ ${chapterPoints[k]} pts</span></div><div class="tiny muted">このステージの判断ポイント</div></div>${k==='saving'?`<div class="smallCard"><div class="miniHead">MONTHLY BOOST</div><div class="bigValue">${yen(S.saved)}</div><div class="tiny muted">選択した習慣の月間節約額（参考）</div><div class="miniHead" style="margin-top:15px">暮らしのバランス</div><div class="meterTrack"><div class="meterFill" style="width:${Math.max(0,Math.min(100,S.joy))}%"></div></div><div class="tiny muted">お金だけでなく、安全と満足度にも注目</div></div>`:`<div class="smallCard"><div class="miniHead">心理学キーワード</div><p class="tiny muted">${k==='mind'?'損失回避・FOMO・事前コミットメント':'参照点・アンカリング・サンクコスト'}</p><p class="tiny muted">値動きの結果より「何を根拠に選ぶか」がポイントです。</p></div>`}</aside></div>`}
function stageDone(k){return `${titleArea(k)}<section class="card"><div style="font-size:66px;text-align:center">${CATEGORIES[k].emoji} ✨</div><h2 style="text-align:center;font-size:29px;margin:8px 0">${CATEGORIES[k].title} ステージクリア！</h2><p style="text-align:center;color:var(--muted)">獲得 ${S.scores[k]} / ${chapterPoints[k]} ポイント。うまくいかなかった選択にも学びがあります。</p>${k==='saving'?`<div class="callout">選んだ習慣が続けば、毎月 <strong>${yen(S.saved)}</strong> の支出が減る想定です。複利ステージでは、この節約額を積立に加えて試せます。</div>`:''}<div class="actions" style="justify-content:center"><button class="btn mint" data-go="${nextCategory()}">${nextCategory()==='report'?'結果レポートへ':'次のステージへ →'}</button><button class="btn secondary" data-go="home">ホームへ</button></div></section>`}
function projection(){const c=S.sim;const monthly=c.monthly+(c.addSaving?S.saved:0);const m=Math.pow(1+c.rate/100,1/12)-1;let value=0,principal=0;const result=[{x:0,v:0,p:0}];for(let year=1;year<=c.years;year++){for(let k=0;k<12;k++){value=value*(1+m)+monthly;principal+=monthly}result.push({x:year,v:value,p:principal})}return {monthly,principal,value,profit:value-principal,series:result}}
function chartSvg(){let p=projection();let data=p.series;let max=Math.max(1,...data.map(x=>x.v),...data.map(x=>x.p))*1.14;let W=730,H=294,l=80,r=22,t=18,b=41;let x=n=>l+(W-l-r)*n/S.sim.years;let y=n=>H-b-(H-t-b)*n/max;let line=field=>data.map((d,i)=>(i?'L':'M')+x(d.x).toFixed(2)+','+y(d[field]).toFixed(2)).join(' ');let grd=[0,.25,.5,.75,1].map(p=>`<line x1="${l}" y1="${y(max*p)}" x2="${W-r}" y2="${y(max*p)}" stroke="#37486e" stroke-width="1"/><text x="${l-12}" y="${y(max*p)+4}" text-anchor="end" fill="#aebddd" font-size="12">${Math.round(max*p/10000)}万</text>`).join('');let years=[0,.25,.5,.75,1].map(p=>`<text x="${x(S.sim.years*p)}" y="${H-13}" text-anchor="middle" fill="#b0c0e1" font-size="12">${Math.round(S.sim.years*p)}年</text>`).join('');let area=line('v')+` L${x(S.sim.years)},${y(0)} L${x(0)},${y(0)} Z`;return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="積立した元本と、一定利回りを仮定した運用資産の推移。${S.sim.years}年後の合計（もしもの計算）${yen(p.value)}、積立元本${yen(p.principal)}。"><defs><linearGradient id="areaFill" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#79e7c7" stop-opacity=".27"/><stop offset="1" stop-color="#79e7c7" stop-opacity=".02"/></linearGradient></defs>${grd}${years}<path d="${area}" fill="url(#areaFill)"/><path d="${line('p')}" fill="none" stroke="#f6ca66" stroke-width="3" stroke-dasharray="7 6"/><path d="${line('v')}" fill="none" stroke="#80e3c4" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><circle cx="${x(S.sim.years)}" cy="${y(p.value)}" r="6" fill="#80e3c4" stroke="#102442" stroke-width="2"/></svg>`}

const HABIT_TYPES={juice:{name:'ジュース',emoji:'🥤',price:160,adult:false},coffee:{name:'缶コーヒー',emoji:'☕',price:150,adult:false},snack:{name:'おかし',emoji:'🍪',price:120,adult:false},tobacco:{name:'たばこ（大人の例）',emoji:'🚭',price:600,adult:true},custom:{name:'じぶんで決める',emoji:'✏️',price:200,adult:false}};
function habitResults(){const h=S.habit,m=h.price*h.skips;const rate=h.rate/100, rm=Math.pow(1+rate,1/12)-1, count=h.years*12;let invested=0;for(let i=0;i<count;i++)invested=invested*(1+rm)+m;return {month:m,year:m*12,save:m*count,invested,extra:invested-m*count}}
function habitPage(){const h=S.habit, p=habitResults(), product=HABIT_TYPES[h.type]||HABIT_TYPES.custom;const explain=h.type==='tobacco'?'たばこは大人の生活習慣の例だよ。子どもは使わない商品だよ。':'好きなものをぜんぶガマンする必要はないよ。できる分だけでOK！';return `<section class="card kidLesson habitPage"><div class="miniHead">STEP 2 · ちょこっと節約じっけん</div><div class="kidTag">🧙‍♂️ ちいさなお金が 未来にワープ！</div><h2>「買わない日」を少しつくったら、どうなるかな？</h2><p>ジュースや缶コーヒーなど、<strong>好きなものを選んで</strong>お金を計算してみよう。</p><div class="habitItems" role="group" aria-label="節約するものを選ぶ">${Object.entries(HABIT_TYPES).map(([key,item])=>`<button type="button" class="habitItem ${h.type===key?'chosen':''}" data-habit-type="${key}" aria-pressed="${h.type===key}"><span class="habitEmoji">${item.emoji}</span><span>${item.name}</span></button>`).join('')}</div><div class="habitConfig"><div class="habitControl"><label for="habitPrice">① 1回いくら？ <strong id="habitPriceOut">${yen(h.price)}</strong></label><input id="habitPrice" type="number" min="10" max="10000" step="10" inputmode="numeric" value="${h.price}" aria-describedby="priceHint"/><small id="priceHint">値段はゲーム用の例。お店によって変わるよ。</small></div><div class="habitControl"><label for="habitSkips">② 月に何回へらす？ <strong id="habitSkipsOut">${h.skips}回</strong></label><input id="habitSkips" type="range" min="1" max="30" step="1" value="${h.skips}"/><div class="rangeText"><span>1回</span><span>30回</span></div></div><div class="habitControl"><label for="habitYears">③ 何年間つづける？ <strong id="habitYearsOut">${h.years}年</strong></label><input id="habitYears" type="range" min="1" max="40" step="1" value="${h.years}"/><div class="rangeText"><span>1年</span><span>40年</span></div></div><div class="habitControl"><label>④ 「もし投資したら」の割合</label><div class="ratePresets">${[0,3,5,7].map(r=>`<button class="ratePreset ${h.rate===r?'selected':''}" data-habit-rate="${r}" aria-pressed="${h.rate===r}">${r}％</button>`).join('')}</div><small>これは学習用の仮定だよ。投資しないなら0％を見てね。</small></div></div><div class="habitStory">${product.emoji} <span id="habitSentence">${yen(h.price)}の${product.name}を、ひと月に${h.skips}回買わなかったら…</span></div><div class="habitEquation"><span id="habitEquationLeft">${yen(h.price)} × ${h.skips}回 ＝</span> <strong id="habitMonth">${yen(p.month)}</strong><small>ひと月に残せるお金</small></div><div class="habitMilestones"><div><span>🗓️ 1年間では</span><strong id="habitAnnual">${yen(p.year)}</strong><small>12か月分</small></div><div><span id="habitYearLabel">🐷 ${h.years}年間ためると</span><strong id="habitPlain">${yen(p.save)}</strong><small>貯金箱に入れるイメージ</small></div></div><div class="habitBigCompare"><h3>🌱 じゃあ、同じお金を毎月「積み立てて」みたら？</h3><div class="habitCompareRow"><span>🐷 ためるだけ（0％）</span><b id="habitPlain2">${yen(p.save)}</b></div><div class="habitBar"><div id="habitSaveBar" class="habitBarInner save" style="width:${Math.max(3,p.save/(Math.max(p.save,p.invested)||1)*100)}%"></div></div><div class="habitCompareRow"><span id="habitRateLabel">🌳 毎年${h.rate}％ずつ増えると仮定</span><b id="habitInvest">${yen(p.invested)}</b></div><div class="habitBar"><div id="habitInvestBar" class="habitBarInner grow" style="width:${Math.max(3,p.invested/(Math.max(p.save,p.invested)||1)*100)}%"></div></div><p class="habitExtra">ちがいは <strong id="habitExtra">${yen(p.extra)}</strong>（増えた分の想定）</p></div><p class="kidWarning">⚠️ 右の数字は、毎月末に同じ金額を積み立て、決めた割合で増え続けたと<strong>仮定した計算</strong>だよ。本当にそうなるとは限らず、投資では減ることもあるよ。実際の税金・手数料・物価の変化は入れていないよ。</p><p class="habitRemark" id="habitRemark">${explain}</p><div class="actions"><button class="btn mint" data-habit-apply>🎮 この金額で複利のグラフを見る →</button><button class="btn secondary" data-compound-mode="guide">📖 しくみをおさらい</button></div></section>`}
function bindHabit(){const price=document.getElementById('habitPrice'),skips=document.getElementById('habitSkips'),years=document.getElementById('habitYears');if(!price||!skips||!years)return;const put=(id,txt)=>{const e=document.getElementById(id);if(e)e.textContent=txt};function update(){const h=S.habit;h.price=Math.min(10000,Math.max(10,Number(price.value)||10));h.skips=Number(skips.value);h.years=Number(years.value);const p=habitResults(),name=(HABIT_TYPES[h.type]||HABIT_TYPES.custom);put('habitPriceOut',yen(h.price));put('habitSkipsOut',h.skips+'回');put('habitYearsOut',h.years+'年');put('habitSentence',yen(h.price)+'の'+name.name+'を、ひと月に'+h.skips+'回買わなかったら…');put('habitEquationLeft',yen(h.price)+' × '+h.skips+'回 ＝');put('habitYearLabel','🐷 '+h.years+'年間ためると');put('habitMonth',yen(p.month));put('habitAnnual',yen(p.year));put('habitPlain',yen(p.save));put('habitPlain2',yen(p.save));put('habitInvest',yen(p.invested));put('habitExtra',yen(p.extra));document.getElementById('habitSaveBar').style.width=Math.max(3,100*p.save/(Math.max(p.save,p.invested)||1))+'%';document.getElementById('habitInvestBar').style.width=Math.max(3,100*p.invested/(Math.max(p.save,p.invested)||1))+'%';put('habitRateLabel','🌳 毎年'+h.rate+'％ずつ増えると仮定');document.querySelectorAll('[data-habit-rate]').forEach(b=>{b.classList.toggle('selected',+b.dataset.habitRate===h.rate);b.setAttribute('aria-pressed',String(+b.dataset.habitRate===h.rate))});persist()};[price,skips,years].forEach(el=>el.addEventListener('input',update))}
function compoundTabs(){const tab=(mode,emoji,heading,sub)=>`<button type="button" class="compoundTab ${S.compoundMode===mode?'active':''}" data-compound-mode="${mode}" aria-pressed="${S.compoundMode===mode}"><span>${emoji} ${heading}</span><small>${sub}</small></button>`;return `<div class="compoundTabs" role="group" aria-label="複利クエストの3つのメニュー">${tab('guide','📖','① しくみを知る','やさしいお話')}${tab('habit','🥤','② ちょこっと節約','買い物で実験')}${tab('sim','🎮','③ ふやしてみる','数字を動かす')}</div>`}
function compoundGuide(){const basics=[['元本（がんぽん）','最初に自分で出したお金。たとえば1万円。'],['積立（つみたて）','毎月100円ずつ、決まった額をためていくこと。'],['年利（ねんり）','1年でどれくらい増えたかを、％で表したもの。5％なら100円につき5円。'],['運用益（うんようえき）','投資して増えたお金。減ることもあるよ。'],['複利（ふくり）','増えたお金もいっしょにして、つぎの増え方を計算すること。'],['投資信託（とうししんたく）','みんなのお金を集めて、いくつもの投資先で運用する商品。値下がりもあるよ。']], extras=terms.slice(6);return `<section class="card lessonHero kidLesson"><div class="miniHead">STEP 1 · まずは しくみを知ろう</div><div class="kidTag">🌱 お金が お金を そだてるって？</div><h2>「ふくり」は、お金についたプラスが、<span class="markerText">つぎのプラスを生む</span>こと。</h2><p>たとえば、<strong>1万円</strong>を持っていて、毎年<strong>5％ずつ</strong>ふえるとしたらどうなるかな？</p><div class="kidMoneyFlow"><div class="kidMoneyStep"><span>🌰 はじめ</span><strong>10,000円</strong><small>自分のお金</small></div><div class="kidArrow">➡️</div><div class="kidMoneyStep"><span>🌱 1年後</span><strong>10,500円</strong><small>500円ふえた！</small></div><div class="kidArrow">➡️</div><div class="kidMoneyStep kidStrong"><span>🌳 2年後</span><strong>11,025円</strong><small>こんどは525円ふえた！</small></div></div><div class="kidWhy">💡 <b>なぜ2年目は525円？</b><p>はじめの1万円だけでなく、あとからふえた500円も合わせて計算するからだよ。</p></div><div class="kidCompare"><div><span>ふえた分を足さないと</span><strong>11,000円</strong><small>毎年500円ずつふえる</small></div><div><span>ふえた分も足すと（複利）</span><strong>11,025円</strong><small>2年目は525円ふえる</small></div></div><p class="lessonTakeaway">最初はたった25円の差。でも、<b>長く続けるほど差が広がる</b>ことがあるんだ。これは毎年5％ふえるとした例だよ。</p></section>
<section class="card lessonCard kidLesson"><div class="miniHead">STEP 2 · 5％はなんの数字？</div><h2>5％は「100円につき5円ぶん」。でも、約束された数字じゃないよ。</h2><div class="kidMath"><span>100円の 5％ → <strong>5円</strong></span><span>10,000円の 5％ → <strong>500円</strong></span></div><p><b>投資信託（とうししんたく）</b>は、みんなのお金を集めて、いろいろな会社や国などに分けて投資する商品。お金がふえる年も、へる年もあるよ。</p><p>昔の日本の年金の運用（GPIF）では、長い期間の平均が<b>年率約5％</b>だった例があるんだ。でも、<strong>投資信託ならどれも平均5％という意味ではない</strong>よ。</p><div class="kidRates"><div><strong>0％</strong><span>ふえない</span></div><div><strong>3％</strong><span>小さめの仮定</span></div><div class="focus"><strong>5％</strong><span>お手本の仮定</span></div><div><strong>7％</strong><span>大きめの仮定</span></div></div><div class="kidWarning">⚠️ 本当の投資は、減ってしまうこともあるよ。5％でふえることは<strong>保証されない</strong>よ。お金を貯めることと、投資することは別の選択だよ。</div><details class="kidDetails"><summary>大人や先生向け：5％の根拠と出典を見る</summary><p>GPIFの2001年度〜2026年度第1四半期の過去の長期運用成績は年率4.95％と公表されています。ただしこれは株式・債券を組み合わせた公的年金の運用実績であり、一般的な投資信託の平均ではありません。金融庁の過去の分散投資例（条件付き）でも年率2〜8％の範囲が示されています。いずれも将来の予測ではありません。</p><p>${sourceLink('GPIFの過去の運用実績',FINANCE_SOURCES.gpif)} ／ ${sourceLink('金融庁の分散投資の資料',FINANCE_SOURCES.fsaRange)} ／ ${sourceLink('金融庁の資産形成の基本',FINANCE_SOURCES.fsa)}</p></details></section>
<section class="card lessonCard kidLesson"><div class="miniHead">STEP 3 · ことばを覚えよう</div><h2>まずは、この6つだけ！</h2><div class="kidTerms">${basics.map(([term,desc],i)=>`<div class="kidTerm"><span class="termIcon">${['🪙','📅','📈','✨','🌱','🧺'][i]}</span><div><b>${term}</b><p>${desc}</p></div></div>`).join('')}</div><details class="kidDetails"><summary>もう少しむずかしい8つの言葉も見る</summary><div class="kidTerms">${extras.map(([term,desc])=>`<div class="kidTerm"><div><b>${term}</b><p>${desc}</p></div></div>`).join('')}</div></details></section><div class="readyCard"><div><div class="eyebrow">つぎは じっけん！</div><h2>ジュースを少し買わなかったら、どうなる？</h2><p>150円くらいの小さなお金から、20年後まで計算してみよう。</p></div><button class="btn mint" data-compound-mode="habit">🥤 節約じっけんへ →</button></div>`}
function compoundSimulator(){const q=QUESTIONS.compound[0], f=S.feedback&&S.feedback.stage==='compound'?S.feedback:null,p=projection();return `<div class="card"><div class="miniHead">COMPOUND LAB · 数字を動かそう</div><h2 style="margin:0 0 8px;font-size:23px">お金のタネを、何年か育ててみよう 🌱</h2><p class="muted tiny" style="margin-top:0">月にためるお金・増え方・年数の3つを動かすと、グラフが変わるよ。<strong>毎月末に積み立て、毎年同じ割合で増える</strong>という仮定です。税金・費用・物価変動・相場の上下は含まれません。</p><div class="simHints"><div><b>毎月の積立額</b><span>毎月いくら出すか</span></div><div><b>年利</b><span>1年間の増減率（仮定）</span></div><div><b>期間</b><span>何年間続けるか</span></div></div><div class="simControls"><div class="control"><label for="monthly">月にいくらためる？ <output id="monthlyOut">${yen(S.sim.monthly)}</output></label><input type="range" id="monthly" min="0" max="100000" step="100" value="${S.sim.monthly}"></div><div class="control"><label for="rate">仮定の1年で増える割合（仮定） <output id="rateOut">${S.sim.rate}%</output></label><input type="range" id="rate" min="-5" max="10" step="1" value="${S.sim.rate}"><div class="ratePresets" role="group" aria-label="利回りの比較用プリセット">${[0,3,5,7].map(v=>`<button type="button" class="ratePreset ${S.sim.rate===v?'selected':''}" data-rate-preset="${v}">${v}%</button>`).join('')}</div></div><div class="control"><label for="years">何年間つづける？ <output id="yearsOut">${S.sim.years}年</output></label><input type="range" id="years" min="5" max="40" step="5" value="${S.sim.years}"></div><div class="control"><label style="display:block">節約クエストでへらしたお金も足す？</label><label class="toggle"><input type="checkbox" id="addSaving" ${S.sim.addSaving?'checked':''}><span>節約額 ${yen(S.saved)}/月 を上乗せ</span></label><span class="muted tiny">節約クエストを遊ぶと、節約額が反映されます。</span></div></div><div class="moneySummary"><div><span>毎月ためるお金（合計）</span><b id="msMonthly">${yen(p.monthly)}</b></div><div><span>自分でためた合計</span><b id="msPrincipal">${yen(p.principal)}</b></div><div><span>ふえた分（仮定）</span><b id="msProfit" style="color:${p.profit>=0?'var(--mint)':'var(--pink)'}">${yen(p.profit)}</b></div></div><div class="futureResult"><span>${S.sim.years}年後の合計（もしもの計算）</span><strong id="futureValue">${yen(p.value)}</strong></div><div id="chartHost">${chartSvg()}</div><div class="legend"><span><b style="background:var(--mint)"></b>想定の運用資産（積立額＋運用損益）</span><span><b style="background:var(--gold)"></b>積立元本（自分が出した合計額）</span></div><div class="callout kidPrompt"><strong>ミッション：</strong>最初にまず0％にして、貯金だけならいくらかを確認。次に3％・5％・7％を比べてみましょう。利回りを変えると、グラフの差がどう変わるでしょう？</div><div class="actions"><button class="btn secondary small" data-compound-mode="guide">📖 もう一度わかりやすい説明を見る</button></div></div><div class="card" style="margin-top:18px"><div class="miniHead">${S.done.compound?'MISSION COMPLETE · いつでも復習できます':'LAST MISSION · 理解度チェック'}</div>${S.done.compound?`<h3>🎉 複利クエスト、クリア済み！</h3><p>条件を自由に変えて、何度でもシミュレーションできます。ポイントを二重加算することはありません。</p><div class="actions"><button class="btn mint" data-go="${nextCategory()}">${nextCategory()==='report'?'結果レポートへ':'次のステージへ →'}</button></div>`:`<h3>${q.q}</h3><div class="story">${q.story}</div>${f?`<div class="feedback" role="status"><span class="chip">${f.points} / 3 POINTS · ${f.tag}</span><h3>${f.points===3?'ナイス判断！':'学びを発見！'}</h3><p>${f.why}</p><div class="actions"><button class="btn" data-next="compound">ステージをクリア →</button></div></div>`:`<div class="choices">${q.opts.map((o,i)=>`<button class="choice" data-answer="compound:${i}"><span class="letter">${'ABC'[i]}</span>${o.label}</button>`).join('')}</div>`}`}</div>`}
function compoundPage(){return `${titleArea('compound')}${compoundTabs()}${S.compoundMode==='sim'?compoundSimulator():S.compoundMode==='habit'?habitPage():compoundGuide()}`}
function savingPage(){return `<div class="saveIntro"><div><div class="miniHead">ゲームのまえに</div><h2>🥤 150円の買い物を少しへらすと？</h2><p>小さなお金も、毎月つみ重ねると大きな金額に！ 商品を選んで実験できるよ。</p></div><button class="btn mint" data-go-habit>節約じっけんへ →</button></div>${quiz('saving')}`}
function report(){const all=doneCount()===4;const score=totalScore();const type=score>=25?'じっくり考えるマネー探検家':score>=17?'判断力が育つアドベンチャー':score>=9?'発見いっぱいのチャレンジャー':'お金と心の見習い冒険家';const icon=score>=25?'🏆':score>=17?'🧭':score>=9?'🌟':'🎒';return `<div class="pageTop"><div class="eyebrow">YOUR REPORT</div><h1 class="pageTitle">あなただけの冒険レポート</h1><div class="muted">点数は教育用のフィードバックです。投資能力や人格を判定するテストではありません。</div></div>${summaryMetrics()}<div class="reportGrid"><div class="reportBadge"><div class="icon">${icon}</div><strong>${type}</strong><p>${all?'全4ステージ完走、おめでとう！':'現在 '+doneCount()+' / 4 ステージ完了。まだ冒険は続きます。'}</p><div style="font-size:28px;font-weight:950;color:var(--gold)">${score} / 30 PTS</div></div><div class="card"><h2 style="margin-top:0">4つの判断スキル</h2><div class="skillRows">${ORDER.map(k=>`<div class="skillRow"><b>${CATEGORIES[k].emoji} ${CATEGORIES[k].title}</b><div class="track"><div class="fill" style="width:${S.scores[k]/chapterPoints[k]*100}%;background:${CATEGORIES[k].color}"></div></div><span>${S.scores[k]}/${chapterPoints[k]}</span></div>`).join('')}</div><div class="reportAdvice"><b>今日の学び：</b>合理的な投資判断は、未来の値動きを当てることではなく、<strong>目的・情報・リスク・感情</strong>を整理することから始まります。</div></div></div><div class="card" style="margin-top:18px"><h2 style="margin:0 0 8px">ゲームを現実につなげるなら</h2><p class="muted" style="font-size:14px">節約で生まれたお金は、必ず投資すべきものではありません。まずは生活の安全を支え、そのうえで目的と時期に合う使い道を考えます。</p><div class="actions"><button class="btn" id="exportCsv" ${S.records.length?'':'disabled'}>📄 プレイ記録をCSV保存</button><button class="btn secondary" data-go="${nextCategory()==='report'?'compound':nextCategory()}">${all?'複利ラボをもう一度見る':'未クリアのステージへ →'}</button><button class="btn secondary" data-go="home">ホームへ</button></div></div>`}
function answer(key,index){if(S.feedback||S.steps[key]>=QUESTIONS[key].length)return;const q=QUESTIONS[key][S.steps[key]],o=q.opts[index];if(!o)return;S.scores[key]+=o.points;S.records.push({stage:CATEGORIES[key].title,scene:q.title,choice:o.label,points:o.points,concept:o.tag});if(key==='saving'){S.saved+=(o.save||0);S.joy=Math.max(0,Math.min(100,S.joy+(o.joy||0)*5))}S.feedback={stage:key,index,points:o.points,label:o.label,tag:o.tag,why:o.why,save:o.save||0};persist();render()}
function next(key){if(!S.feedback||S.feedback.stage!==key)return;S.feedback=null;S.steps[key]++;if(S.steps[key]>=QUESTIONS[key].length)S.done[key]=true;persist();render();window.scrollTo({top:0,behavior:'smooth'})}
function render(){renderNav();const app=document.getElementById('app');app.innerHTML=S.screen==='home'?home():S.screen==='report'?report():S.screen==='compound'?compoundPage():S.screen==='saving'?savingPage():quiz(S.screen);if(S.screen==='compound'&&S.compoundMode==='sim')bindCompound();if(S.screen==='compound'&&S.compoundMode==='habit')bindHabit();document.getElementById('exportCsv')?.addEventListener('click',exportCsv)}
function bindCompound(){const m=document.getElementById('monthly'),r=document.getElementById('rate'),y=document.getElementById('years'),a=document.getElementById('addSaving');if(!m||!r||!y||!a)return;function update(){S.sim.monthly=Number(m.value);S.sim.rate=Number(r.value);S.sim.years=Number(y.value);S.sim.addSaving=a.checked;persist();document.getElementById('monthlyOut').textContent=yen(S.sim.monthly);document.getElementById('rateOut').textContent=S.sim.rate+'%';document.getElementById('yearsOut').textContent=S.sim.years+'年';const p=projection();document.getElementById('msMonthly').textContent=yen(p.monthly);document.getElementById('msPrincipal').textContent=yen(p.principal);const pf=document.getElementById('msProfit');pf.textContent=yen(p.profit);pf.style.color=p.profit>=0?'var(--mint)':'var(--pink)';document.getElementById('futureValue').textContent=yen(p.value);document.getElementById('chartHost').innerHTML=chartSvg();document.querySelectorAll('[data-rate-preset]').forEach(el=>el.classList.toggle('selected',Number(el.dataset.ratePreset)===S.sim.rate))};[m,r,y,a].forEach(el=>el.addEventListener('input',update))}
function exportCsv(){if(!S.records.length)return;const rows=[['ステージ','問題','選択','判断ポイント','ポイント'],...S.records.map(r=>[r.stage,r.scene,r.choice,r.concept,r.points])];const val=v=>'"'+String(v).replace(/"/g,'""')+'"';const csv='\ufeff'+rows.map(r=>r.map(val).join(',')).join('\r\n');const url=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8;'}));const a=document.createElement('a');a.href=url;a.download='money_quest_record.csv';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000)}
document.addEventListener('click',e=>{const target=e.target.closest('[data-go-habit],[data-habit-apply],[data-habit-type],[data-habit-rate],[data-compound-mode],[data-rate-preset],[data-go],[data-answer],[data-next]');if(!target)return;if(target.hasAttribute('data-go-habit')){S.compoundMode='habit';changeScreen('compound')}else if(target.hasAttribute('data-habit-apply')){const h=S.habit;S.sim={monthly:h.price*h.skips,rate:h.rate,years:h.years,addSaving:false};S.compoundMode='sim';persist();render();window.scrollTo({top:0,behavior:'smooth'})}else if(target.dataset.habitType){const t=HABIT_TYPES[target.dataset.habitType];S.habit.type=target.dataset.habitType;S.habit.price=t.price;persist();render()}else if(target.dataset.habitRate!==undefined){S.habit.rate=Number(target.dataset.habitRate);persist();render()}else if(target.dataset.compoundMode){if(target.dataset.seed==='beginner'){S.sim={...S.sim,monthly:1000,rate:5,years:20,addSaving:false}}S.compoundMode=target.dataset.compoundMode;persist();render();window.scrollTo({top:0,behavior:'smooth'})}else if(target.dataset.ratePreset!==undefined){S.sim.rate=Number(target.dataset.ratePreset);document.getElementById('rate').value=String(S.sim.rate);document.getElementById('rate').dispatchEvent(new Event('input',{bubbles:true}))}else if(target.dataset.go){changeScreen(target.dataset.go)}else if(target.dataset.answer){const [key,choice]=target.dataset.answer.split(':');answer(key,Number(choice))}else if(target.dataset.next){next(target.dataset.next)}});
document.getElementById('resetButton').addEventListener('click',()=>{if(confirm('この端末に保存されたプレイ記録を消して、最初から始めますか？')){S=defaults();persist();render();window.scrollTo(0,0)}});
render();

</script>
