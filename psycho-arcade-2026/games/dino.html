<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width,initial-scale=1.0">

<title>🦖 DINO ADVENTURE DX</title>

<style>

body{
    margin:0;
    background:#5C94FC;
    font-family:sans-serif;
    text-align:center;
}

h1{
    color:white;
    text-shadow:3px 3px 0 black;
}

#ui{
    color:white;
    font-size:24px;
    margin:10px;
}

#game{
    position:relative;
    width:900px;
    height:450px;
    margin:auto;
    overflow:hidden;
    border:5px solid black;
    background:#5C94FC;
}

#world{
    position:absolute;
    width:2400px;
    height:450px;
}

#ground{
    position:absolute;
    left:0;
    bottom:0;
    width:2400px;
    height:60px;
    background:#C84C0C;
}

.platform{
    position:absolute;
    width:140px;
    height:20px;
    background:#B5651D;
    border:3px solid #7A3E00;
}

.pit{
    position:absolute;
    bottom:0;
    height:60px;
    background:black;
}

.player,
.enemy,
.egg,
.goal,
.power,
.cloud{
    position:absolute;
    user-select:none;
}

.player{
    font-size:60px;
    transform-origin:center center;
}

.enemy{
    font-size:50px;
    transform-origin:center center;
}

/* 赤敵 */
.enemy.red{
    filter:hue-rotate(-60deg)
           saturate(3);
}

/* 青敵 */
.enemy.blue{
    filter:hue-rotate(120deg)
           saturate(3);
}

/* 紫敵 */
.enemy.purple{
    filter:hue-rotate(220deg)
           saturate(3);
}

.egg{
    font-size:36px;
}

.power{
    font-size:36px;
}

.goal{
    font-size:60px;
}

.cloud{
    font-size:40px;
}

#message{
    position:absolute;
    inset:0;
    display:none;
    justify-content:center;
    align-items:center;
    flex-direction:column;
    background:rgba(0,0,0,.85);
    color:white;
    z-index:999;
}

#message h2{
    font-size:60px;
    margin:0;
}

#message p{
    font-size:30px;
}

#message button{
    margin-top:20px;
    padding:10px 20px;
    font-size:22px;
    cursor:pointer;
}

</style>
<link rel="stylesheet" href="arcade-game.css">
</head>

<body>

<h1>🦖 DINO ADVENTURE DX</h1>

<div id="ui">

STAGE:
<span id="stageNo">1</span>

｜
LIFE:
<span id="life">3</span>

｜
SCORE:
<span id="score">0</span>

｜
ENEMY:
<span id="enemyCount">3</span>

<span id="status"></span>

</div>

<div id="game">

<div id="world">

<div id="ground"></div>

<!-- 雲 -->
<div class="cloud"
style="left:200px;top:40px;">☁️</div>

<div class="cloud"
style="left:1000px;top:60px;">☁️</div>

<div class="cloud"
style="left:1800px;top:40px;">☁️</div>

<!-- 足場 -->
<div class="platform"
style="left:250px;top:300px;"></div>

<div class="platform"
style="left:550px;top:240px;"></div>

<div class="platform"
style="left:850px;top:180px;"></div>

<div class="platform"
style="left:1250px;top:250px;"></div>

<div class="platform"
style="left:1650px;top:180px;"></div>

<!-- プレイヤー -->
<div id="player"
class="player">
🦖
</div>

<!-- タマゴ -->
<div class="egg"
style="left:290px;top:250px;">🥚</div>

<div class="egg"
style="left:600px;top:190px;">🥚</div>

<div class="egg"
style="left:900px;top:130px;">🥚</div>

<div class="egg"
style="left:1300px;top:200px;">🥚</div>

<div class="egg"
style="left:1700px;top:130px;">🥚</div>

<!-- スター -->
<div id="power"
class="power"
style="left:1450px;top:120px;">
⭐
</div>

<!-- 敵 -->

<div class="enemy red"
style="left:900px;top:330px;">
🦕
</div>

<div class="enemy blue"
style="left:1400px;top:330px;">
🦕
</div>

<div class="enemy purple"
style="left:1800px;top:330px;">
🦕
</div>

<!-- 穴 -->

<div class="pit"
style="left:1100px;width:180px;">
</div>

<!-- ゴール -->

<div id="goal"
class="goal"
style="left:2200px;top:280px;">
🚩
</div>

</div>

<div id="message"></div>

</div>
<script>

let currentStage = 1;

let score = 0;
let life = 3;

const scoreText =
document.getElementById("score");

const lifeText =
document.getElementById("life");

const stageText =
document.getElementById("stageNo");

const enemyCountText =
document.getElementById("enemyCount");

const statusText =
document.getElementById("status");

const world =
document.getElementById("world");

const message =
document.getElementById("message");

let player =
document.getElementById("player");

let goal =
document.getElementById("goal");

let power =
document.getElementById("power");

let x = 50;
let y = 330;
let vy = 0;

let cameraX = 0;

let jumping = false;
let invincible = false;
let gameEnded = false;

const keys = {};

let enemyData = [];

document.addEventListener(
"keydown",
(e)=>{

    keys[e.code] = true;

    if(
        (e.code==="Space" ||
         e.code==="ArrowUp")
         && !jumping
    ){

        vy = -18;
        jumping = true;
    }
});

document.addEventListener(
"keyup",
(e)=>{

    keys[e.code] = false;
});

function collision(a,b){

    const r1 =
    a.getBoundingClientRect();

    const r2 =
    b.getBoundingClientRect();

    return (

        r1.left < r2.right &&
        r1.right > r2.left &&
        r1.top < r2.bottom &&
        r1.bottom > r2.top

    );
}

function showMessage(
title,
color,
buttonText,
callback
){

    gameEnded = true;

    message.style.display =
    "flex";

    message.innerHTML = `
        <h2 style="color:${color}">
            ${title}
        </h2>

        <p>
            SCORE:
            ${score}
        </p>

        <button id="nextBtn">
            ${buttonText}
        </button>
    `;

    document
    .getElementById("nextBtn")
    .onclick = callback;
}

function loseLife(){

    life--;

    lifeText.textContent =
    life;

    if(life <= 0){

        showMessage(
            "💥 GAME OVER",
            "#ff4444",
            "RESTART",
            ()=>location.reload()
        );

        return;
    }

    x = 50;
    y = 330;
    vy = 0;
}

function setupEnemies(){

    enemyData = [];

    const enemies =
    document.querySelectorAll(
        ".enemy"
    );

    enemyCountText.textContent =
    enemies.length;

    enemies.forEach(
    (enemy,index)=>{

        const isBlue =
        enemy.classList.contains(
            "blue"
        );

        const isPurple =
        enemy.classList.contains(
            "purple"
        );

        enemyData.push({

            element: enemy,

            x: parseInt(
                enemy.style.left
            ),

            // 青敵は速い
            speed:
            isBlue ? 4 : 2,

            // 紫敵はHP2
            hp:
            isPurple ? 2 : 1,

            min:
            parseInt(
                enemy.style.left
            ) - 120,

            max:
            parseInt(
                enemy.style.left
            ) + 120

        });

    });

}

setupEnemies();

player.style.left =
x + "px";

player.style.top =
y + "px";

player.style.transform =
"scaleX(-1)";

function updatePlayer(){

    if(keys["ArrowLeft"]){

        x -= 6;

        player.style.transform =
        "scaleX(1)";
    }

    if(keys["ArrowRight"]){

        x += 6;

        player.style.transform =
        "scaleX(-1)";
    }

    x = Math.max(
        0,
        Math.min(2350,x)
    );

    vy += 0.65;

    y += vy;

    const size = 60;

    document
    .querySelectorAll(".platform")
    .forEach(platform=>{

        const left =
        platform.offsetLeft;

        const right =
        left +
        platform.offsetWidth;

        const top =
        platform.offsetTop;

        const bottom =
        y + size;

        if(
            vy >= 0 &&
            x + size > left &&
            x < right &&
            bottom >= top &&
            bottom <= top + 20
        ){

            y = top - size;

            vy = 0;

            jumping = false;
        }

    });

    if(y >= 330){

        y = 330;
        vy = 0;
        jumping = false;
    }

    player.style.left =
    x + "px";

    player.style.top =
    y + "px";
}

function updateEnemies(){

    enemyData.forEach(data=>{

        const enemy =
        data.element;

        if(
            enemy.style.display
            === "none"
        ){
            return;
        }

        data.x += data.speed;

        if(data.x < data.min){

            data.speed =
            Math.abs(data.speed);

        }

        if(data.x > data.max){

            data.speed =
            -Math.abs(data.speed);

        }

        enemy.style.left =
        data.x + "px";

        enemy.style.transform =

        data.speed > 0

        ? "scaleX(-1)"

        : "scaleX(1)";

    });

}

function updateCamera(){

    cameraX = x - 350;

    if(cameraX < 0)
        cameraX = 0;

    if(cameraX > 1500)
        cameraX = 1500;

    world.style.transform =
    `translateX(${-cameraX}px)`;
}
function loadStage2(){

    currentStage = 2;

    stageText.textContent = "2";

    world.innerHTML = `

    <div id="ground"></div>

    <div style="
    position:absolute;
    left:500px;
    top:20px;
    font-size:120px;">
    🌋
    </div>

    <div style="
    position:absolute;
    left:1500px;
    top:20px;
    font-size:120px;">
    🌋
    </div>

    <div class="platform"
    style="left:250px;top:300px;"></div>

    <div class="platform"
    style="left:500px;top:250px;"></div>

    <div class="platform"
    style="left:750px;top:200px;"></div>

    <div class="platform"
    style="left:1000px;top:250px;"></div>

    <div class="platform"
    style="left:1250px;top:200px;"></div>

    <div class="platform"
    style="left:1500px;top:150px;"></div>

    <div class="platform"
    style="left:1800px;top:150px;"></div>

    <div class="platform"
    style="left:2050px;top:120px;"></div>

    <div id="player"
    class="player">
    🦖
    </div>

    <div class="egg"
    style="left:320px;top:250px;">
    🥚
    </div>

    <div class="egg"
    style="left:820px;top:150px;">
    🥚
    </div>

    <div class="egg"
    style="left:1320px;top:150px;">
    🥚
    </div>

    <div id="power"
    class="power"
    style="left:1900px;top:90px;">
    ⭐
    </div>

    <div class="enemy red"
    style="left:850px;top:330px;">
    🦕
    </div>

    <div class="enemy blue"
    style="left:1300px;top:330px;">
    🦕
    </div>

    <div class="enemy purple"
    style="left:1850px;top:330px;">
    🦕
    </div>

    <div class="pit"
    style="left:1150px;width:220px;">
    </div>

    <div id="goal"
    class="goal"
    style="left:2200px;top:80px;">
    🏆
    </div>

    `;

    player =
    document.getElementById(
        "player"
    );

    goal =
    document.getElementById(
        "goal"
    );

    power =
    document.getElementById(
        "power"
    );

    x = 50;
    y = 330;
    vy = 0;

    player.style.left =
    x + "px";

    player.style.top =
    y + "px";

    player.style.transform =
    "scaleX(-1)";

    setupEnemies();

    gameEnded = false;

    message.style.display =
    "none";
}

function gameLoop(){

    if(gameEnded){

        requestAnimationFrame(
            gameLoop
        );

        return;
    }

    updatePlayer();
    updateEnemies();
    updateCamera();

    /* タマゴ取得 */

    document
    .querySelectorAll(".egg")
    .forEach(egg=>{

        if(
            egg.style.display !== "none" &&
            collision(player,egg)
        ){

            egg.style.display =
            "none";

            score += 100;

            scoreText.textContent =
            score;
        }

    });

    /* スター取得 */

    if(
        power &&
        power.style.display !== "none" &&
        collision(player,power)
    ){

        power.style.display =
        "none";

        invincible = true;

        statusText.textContent =
        " ⭐ INVINCIBLE";

        setTimeout(()=>{

            invincible = false;

            statusText.textContent =
            "";

        },5000);
    }

    /* 敵との当たり判定 */

    enemyData.forEach(data=>{

        const enemy =
        data.element;

        if(
            enemy.style.display === "none"
        ){
            return;
        }

        if(
            collision(player,enemy)
        ){

            const p =
            player.getBoundingClientRect();

            const e =
            enemy.getBoundingClientRect();

            /* 上から踏んだ */

            if(
                vy > 0 &&
                p.bottom < e.top + 20
            ){

                if(data.hp > 1){

                    data.hp--;

                    enemy.style.opacity =
                    "0.5";

                }else{

                    enemy.style.display =
                    "none";

                    score += 200;

                    scoreText.textContent =
                    score;

                    const alive =

                    [...document
                      .querySelectorAll(
                        ".enemy"
                      )]

                    .filter(enemy=>

                        enemy.style.display
                        !== "none"

                    ).length;

                    enemyCountText
                    .textContent = alive;

                }

                vy = -10;

            }
            else if(
                !invincible
            ){

                loseLife();
            }

        }

    });

    /* 穴 */

    document
    .querySelectorAll(".pit")
    .forEach(pit=>{

        const left =
        pit.offsetLeft;

        const right =
        left +
        pit.offsetWidth;

        if(
            x > left &&
            x < right &&
            y >= 330
        ){

            loseLife();
        }

    });

    /* ゴール */

    if(
        collision(player,goal)
    ){

        if(
            currentStage === 1
        ){

            showMessage(

                "🎉 STAGE 1 CLEAR!",

                "#66ff66",

                "NEXT STAGE",

                ()=>loadStage2()

            );

        }else{

            showMessage(

                "🏆 GAME CLEAR!",

                "#ffff00",

                "RESTART",

                ()=>location.reload()

            );

        }

    }

    requestAnimationFrame(
        gameLoop
    );

}

gameLoop();

</script>

<script defer src="arcade-bridge.js"></script>
</body>
</html>
