<head>

<style>

``

</style>
<link rel="stylesheet" href="arcade-game.css">
</head>
<body>

<h1>反射神経ゲーム</h1>

<div id="guide">
    <strong>🌈 反射神経ゲーム 🌈</strong><br><br>

    🟢 緑が出たら急いでクリック！<br>

    🔴🔵🟡🟣 他の色は押しちゃダメ！<br>

    🎯 緑を5回成功でゲームクリア！<br>

    💥 ミス3回でゲームオーバー！<br><br>

    🏆 キミはどれだけ速く反応できるかな？
</div>

<button id="startBtn">スタート</button>

<div id="gameArea">
    スタートを押してください
</div>

<div id="result"></div>

<div id="ranking">
<h2>🏆ランキング TOP5🏆</h2>
<div id="rankingList">まだ記録がありません</div>
</div>

<script>

// ===== 要素取得 =====
const startBtn = document.getElementById("startBtn");
const gameArea = document.getElementById("gameArea");
const result = document.getElementById("result");

const rankingKey = "reactionRanking";

// ===== ゲーム用変数 =====
let startTime;
let waiting = false;
let canClick = false;

let round = 0;
const maxRounds = 5;
let times = [];

let timer;
let dangerTimer;

// 現在表示中の色
let currentColor = "";

// ミス回数
let missCount = 0;
const maxMiss = 3;

// ===== ランキング表示 =====
function displayRanking() {

    const rankingList =
        document.getElementById("rankingList");

    let ranking =
        JSON.parse(
            localStorage.getItem(rankingKey)
        ) || [];

    if (ranking.length === 0) {

        rankingList.innerHTML =
            "まだ記録がありません";

        return;
    }

    let html = "";

    ranking.forEach((score, index) => {

        html +=
            `${index + 1}位：${score} ms<br>`;

    });

    rankingList.innerHTML = html;
}

// ===== スタート =====
startBtn.addEventListener("click", startGame);

function startGame() {

    round = 0;
    times = [];
    missCount = 0;

    result.textContent = "";

    startBtn.style.display = "none";

    gameArea.style.color = "black";

    nextRound();
    displayRanking();
}

// ===== ラウンド開始 =====
function nextRound() {

    canClick = false;
    waiting = true;

    clearTimeout(dangerTimer);

    gameArea.style.backgroundColor = "lightgray";

    gameArea.textContent =
`ラウンド ${round + 1} / ${maxRounds}
ミス ${missCount}/${maxMiss}
準備中...`;

    const waitTime = Math.random() * 3000 + 2000;

    timer = setTimeout(() => {

        // 緑を出やすくする
        const patterns = [
            { color: "limegreen", text: "押せ！" },
            { color: "limegreen", text: "押せ！" },
            { color: "limegreen", text: "押せ！" },
            { color: "limegreen", text: "押せ！" },
            { color: "limegreen", text: "押せ！" },

            { color: "red", text: "押すな！" },
            { color: "deepskyblue", text: "押すな！" },
            { color: "gold", text: "押すな！" },
            { color: "purple", text: "押すな！" }
        ];

        const selected =
            patterns[Math.floor(Math.random() * patterns.length)];

        currentColor = selected.color;

        gameArea.style.backgroundColor = selected.color;
        gameArea.textContent = selected.text;

        waiting = false;
        canClick = true;

        if (currentColor === "limegreen") {

            startTime = Date.now();

        } else {

            // 押してはいけない色は2秒後に自動で次へ
            dangerTimer = setTimeout(() => {

                if (canClick) {
                    canClick = false;
                    nextRound();
                }

            }, 2000);
        }

    }, waitTime);
}

// ===== クリック判定 =====
gameArea.addEventListener("click", () => {

    if (waiting) {

        clearTimeout(timer);

        gameArea.style.backgroundColor = "crimson";
        gameArea.textContent = "早すぎます！";

        setTimeout(nextRound, 1500);
        return;
    }

    clearTimeout(dangerTimer);

    if (!canClick) {
        return;
    }

    // 緑なら成功
    if (currentColor === "limegreen") {

        const reactionTime =
            Date.now() - startTime;

        times.push(reactionTime);

        round++;

        canClick = false;

        gameArea.style.backgroundColor = "skyblue";
        gameArea.textContent =
            `${reactionTime} ms`;

        setTimeout(() => {

            if (round < maxRounds) {
                nextRound();
            } else {
                endGame();
            }

        }, 1500);

    } else {

        // 押してはいけない色を押した
        canClick = false;

        missCount++;

        if (missCount >= maxMiss) {

            gameArea.style.backgroundColor = "black";
            gameArea.style.color = "white";
            gameArea.textContent = "ゲームオーバー";

            result.innerHTML =
                "<p>押してはいけない色を3回押しました。</p>";

            displayRanking();
            ``

            startBtn.textContent = "もう一度挑戦";
            startBtn.style.display = "inline-block";

            return;
        }

        gameArea.style.backgroundColor = "orange";
        gameArea.textContent =
`押してはいけない色！
ミス ${missCount}/${maxMiss}`;

        setTimeout(() => {
            nextRound();
        }, 1500);
    }

});

// ===== 終了処理 =====
function endGame() {

    let total = 0;

    for (let time of times) {
        total += time;
    }

    const average =
        Math.round(total / times.length);

    let ranking =
        JSON.parse(
            localStorage.getItem(rankingKey)
        ) || [];

    ranking.push(average);

    ranking.sort((a, b) => a - b);

    ranking = ranking.slice(0, 5);

    localStorage.setItem(
        rankingKey,
        JSON.stringify(ranking)
    );

    gameArea.style.backgroundColor = "gold";
    gameArea.style.color = "black";
    gameArea.textContent = "ゲームクリア！";

    result.innerHTML =
        `<p>平均反応時間：${average} ms</p>
         <p>記録：${times.join(" ms, ")} ms</p>`;

    displayRanking();

    startBtn.textContent =
        "もう一度挑戦";

    startBtn.style.display =
        "inline-block";
}
displayRanking();
``
</script>

<script defer src="arcade-bridge.js"></script>
</body>
</html>
