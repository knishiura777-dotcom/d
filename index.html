<script>
(() => {
  const apps = JSON.parse(document.getElementById('catalog-data').textContent);
  const grid = document.getElementById('grid');
  const filters = document.getElementById('filters');
  const search = document.getElementById('search');
  const count = document.getElementById('count');
  let active = 'すべて';
  const categories = ['すべて', ...new Set(apps.flatMap(a => a.tags && a.tags.length ? a.tags : ['その他']))];
  const iconFor = title => /村|シミュレ/.test(title) ? '🏞️' : /心理|思考|心/.test(title) ? '🧠' : /研究|分析/.test(title) ? '📊' : /ゲーム|RPG/.test(title) ? '🎮' : '✦';
  const el = (name, cls, txt) => {const x=document.createElement(name); if(cls)x.className=cls; if(txt!==undefined)x.textContent=txt; return x;};
  function renderFilters(){filters.replaceChildren();for(const c of categories){const b=el('button','filter'+(active===c?' active':''),c);b.type='button';b.setAttribute('aria-pressed',String(active===c));b.addEventListener('click',()=>{active=c;renderFilters();render();});filters.append(b);}}
  function render(){
    const q=search.value.trim().normalize('NFKC').toLocaleLowerCase();
    const visible=apps.filter(a => (active==='すべて'||((a.tags&&a.tags.length?a.tags:['その他']).includes(active))) && [a.title,a.description,a.folder,...(a.tags||[])].join(' ').normalize('NFKC').toLocaleLowerCase().includes(q));
    count.textContent=visible.length;
    grid.replaceChildren();
    if(!visible.length){const empty=el('div','empty');empty.append(el('h2','',apps.length?'見つかりませんでした':'アプリがまだ登録されていません'),el('p','',apps.length?'検索条件を変更してください。':'サブフォルダに index.html を置いて、生成スクリプトを実行してください。'));grid.append(empty);return;}
    for (const a of visible){const card=el('a','app');card.href=a.url;card.setAttribute('aria-label',a.title+' を開く');card.target='_self';const top=el('div','app-top');top.append(el('span','app-icon',iconFor(a.title)),el('span','arrow','↗'));card.append(top,el('h2','',a.title),el('p','desc',a.description||'ブラウザでアプリを開く'));const foot=el('div','foot');foot.append(el('span','','▣'),el('span','folder',a.folder));if(a.tags&&a.tags[0])foot.append(el('span','tag',a.tags[0]));card.append(foot);grid.append(card);}
  }
  search.addEventListener('input',render);
  document.getElementById('view').addEventListener('click',()=>grid.classList.toggle('list-mode'));
  renderFilters();render();
})();
</script>
